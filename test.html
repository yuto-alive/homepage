<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sequential Card Flip Demo</title>
    <link rel="stylesheet" href="test.css" />
    <script src="test.js" defer></script>
  </head>
  <body>
    <main class="demo">
      <div class="cards" aria-label="Sequential flip cards">
        <div class="card-shell">
          <div class="card">
            <div class="front"></div>
            <div class="back"></div>
          </div>
        </div>

        <div class="card-shell">
          <div class="card">
            <div class="front"></div>
            <div class="back"></div>
          </div>
        </div>

        <div class="card-shell">
          <div class="card">
            <div class="front"></div>
            <div class="back"></div>
          </div>
        </div>
      </div>

      <button
        class="flip-button icon-button"
        type="button"
        aria-label="Flip cards"
        title="Flip cards"
      >
        &#10227;
      </button>
    </main>
  </body>
</html>
