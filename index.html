<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Tab</title>
  <meta name="theme-color" content="#050505">

  <link rel="icon" href="chrome-logo-sketch-symbol-variant.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">

    <!-- Album Section -->
    <section class="album-showcase" aria-label="Album showcase">
      <button id="shuffleBtn" class="icon-button" type="button" aria-label="Refresh albums" title="Refresh albums">
        &#10227;
      </button>

      <div class="albums" id="albums"></div>
    </section>

    <!-- Search -->
    <section class="search-section">

      <form action="https://www.google.com/search" method="GET" role="search">
        <input
          type="text"
          name="q"
          placeholder="Search Google or type a URL"
          autocomplete="off"
        />
      </form>

    </section>

    <!-- Shortcuts -->
    <section class="shortcuts-section">

      <div class="shortcuts-grid" id="shortcutsGrid"></div>

      <button id="addShortcutBtn" type="button">
        Add Shortcut
      </button>

    </section>

  </main>

  <!-- Modal -->
  <div class="modal hidden" id="modal" aria-hidden="true">

    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

      <h2 id="modalTitle">Add Shortcut</h2>

      <label for="siteTitle">Title</label>
      <input type="text" id="siteTitle" placeholder="Title" autocomplete="off">

      <label for="siteURL">URL</label>
      <input type="text" id="siteURL" placeholder="https://example.com" autocomplete="off">

      <div class="modal-actions">
        <button id="cancelShortcut" class="secondary-button" type="button">Cancel</button>
        <button id="saveShortcut" type="button">Save</button>
      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
